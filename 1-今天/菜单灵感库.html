<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer 的厨房</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0;--surface:#FFFFFF;--border:#E8E4DC;--border-dark:#C8C2B4;
    --text-primary:#1A1814;--text-secondary:#6B6560;--text-hint:#A09A92;
    --accent:#2D5A3D;--accent-light:#EAF2EC;--accent-mid:#4A8C60;
    --warm:#8B4513;--warm-light:#F5EDE6;
    --info:#1A3A5C;--info-light:#E6EEF6;
    --amber:#7A4F00;--amber-light:#FDF3E3;
    --purple:#4A1A6B;--purple-light:#F3EAF9;
    --rose:#7A1A3A;--rose-light:#FDE8EF;
    --cozy:#7A3A00;--cozy-light:#FDF0E3;
    --short:#C0492B;--short-light:#FDF0EE;--short-mid:#E8B5A8;
    --rotate:#8B6914;--rotate-light:#FBF6E5;--rotate-mid:#D9C588;
    --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:1.25rem 2rem;display:flex;align-items:baseline;gap:1rem;}
  header h1{font-family:'Noto Serif SC',serif;font-size:1.25rem;font-weight:600;letter-spacing:.02em;}
  header .date{font-size:.78rem;color:var(--text-hint);font-weight:300;}
  .main{max-width:1080px;margin:0 auto;padding:1.75rem 1.5rem 3rem;}
  .sh{font-family:'Noto Serif SC',serif;font-size:.85rem;font-weight:600;color:var(--text-secondary);letter-spacing:.05em;margin-bottom:.75rem;display:flex;align-items:center;gap:8px;}
  .sh::after{content:'';flex:1;height:1px;background:var(--border);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem;box-shadow:var(--shadow);}
  .fl{font-size:.68rem;font-weight:500;color:var(--text-hint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.7rem;}
  .tr{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{padding:6px 15px;border-radius:99px;font-size:.8rem;cursor:pointer;border:1px solid var(--border-dark);background:var(--surface);color:var(--text-secondary);transition:all .15s;user-select:none;line-height:1;font-family:inherit;}
  .tag:hover{background:var(--bg);color:var(--text-primary);}
  .tag.cuisine.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tag.method.active{background:var(--cozy);color:#fff;border-color:var(--cozy);}
  .rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;}
  .rl{font-size:.68rem;font-weight:500;color:var(--text-hint);letter-spacing:.1em;text-transform:uppercase;}
  .rc{font-size:.72rem;color:var(--text-hint);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .meal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow);}
  .meal:hover{border-color:var(--accent-mid);transform:translateY(-1px);}
.meal.takeout:hover{border-color:var(--purple);}
.mn{font-family:'Noto Serif SC',serif;font-size:.92rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;}
  .ms{font-size:.74rem;color:var(--text-secondary);line-height:1.55;margin-bottom:9px;}
  .badges{display:flex;flex-wrap:wrap;gap:4px;}
  .b{font-size:.66rem;padding:2px 8px;border-radius:99px;line-height:1.6;}
  .b.time{background:var(--bg);color:var(--text-hint);border:1px solid var(--border);}
  .b.using{background:var(--warm-light);color:var(--warm);}
  .b.takeout-tag{background:var(--purple-light);color:var(--purple);}
  .empty{text-align:center;padding:2.5rem 0;color:var(--text-hint);font-size:.85rem;line-height:2;}
@keyframes slideIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
  /* 统一筛选条:菜系 + 做法 + 想用食材,一处显示 */
  #filterBar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:.85rem;}
  #filterBar:empty{display:none;}
  .fb-label{font-size:.68rem;font-weight:500;color:var(--text-hint);letter-spacing:.1em;text-transform:uppercase;}
  .fb-chip{font-family:inherit;font-size:.78rem;padding:5px 12px;border-radius:99px;border:1px solid;cursor:pointer;transition:all .15s;line-height:1.2;}
  .fb-chip.cuisine{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
  .fb-chip.method{background:var(--cozy-light);border-color:var(--cozy);color:var(--cozy);}
.fb-chip:hover{filter:brightness(.97);text-decoration:line-through;}
  .fb-clear{margin-left:auto;font-size:.72rem;color:var(--text-hint);background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;}
  .fb-clear:hover{color:var(--text-primary);}
/* 甜点 */
  .dessert-section{margin-top:2rem;}
  .dessert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .dessert-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);}
  .dessert-name{font-family:'Noto Serif SC',serif;font-size:.88rem;font-weight:600;color:var(--rose);margin-bottom:3px;}
  .dessert-sub{font-size:.72rem;color:var(--text-hint);}

  /* 便当 */
  .bento-section{margin-top:2rem;}
  .sh.bento-head{cursor:pointer;user-select:none;}
  .sh.bento-head:hover{color:var(--text-primary);}
  .bento-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .bento-top-label{font-size:.68rem;font-weight:500;color:var(--text-hint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;}
  .bento-body{padding:1.1rem 1.5rem;display:none;animation:slideIn .2s ease;}
  .bento-body.show{display:block;}
  .bento-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .bento-item{background:var(--bg);border-radius:8px;padding:10px 14px;}
  .bento-item-label{font-size:.66rem;color:var(--text-hint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
  .bento-item-val{font-size:.82rem;line-height:1.6;}
  .bento-item.hl-s1{border-left:3px solid var(--amber);}
  .bento-item.hl-s2{border-left:3px solid var(--warm);}
  .bento-item.hl-baozi{border-left:3px solid var(--info);}
  .bento-item.hl-chicken{border-left:3px solid var(--accent);}
  .bento-item.fixed{border-left:3px solid var(--border-dark);}

  /* 编辑 */
  .edit-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem;margin-top:2rem;box-shadow:var(--shadow);}
  .edit-toggle{font-size:.78rem;color:var(--text-hint);cursor:pointer;background:none;border:none;font-family:inherit;display:flex;align-items:center;gap:6px;}
  .edit-toggle:hover{color:var(--text-secondary);}
  .edit-body{display:none;margin-top:1.25rem;}
  .edit-body.open{display:block;}
  .edit-list{list-style:none;}
  .edit-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text-secondary);}
  .edit-item:last-child{border-bottom:none;}
  .edit-item-name{font-weight:500;color:var(--text-primary);min-width:120px;}
  .del-btn{background:none;border:none;color:var(--text-hint);cursor:pointer;font-size:.85rem;padding:2px 6px;border-radius:4px;transition:all .1s;margin-left:auto;}
  .del-btn:hover{background:#FEE;color:#c0392b;}
  .add-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1rem;}
  .add-form input,.add-form select{font-family:inherit;font-size:.78rem;padding:8px 12px;border:1px solid var(--border-dark);border-radius:8px;background:var(--bg);color:var(--text-primary);outline:none;}
  .add-form input:focus,.add-form select:focus{border-color:var(--accent-mid);}
  .add-form .full{grid-column:1 / -1;}
  .add-form button{grid-column:1 / -1;font-family:inherit;font-size:.8rem;padding:9px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:500;transition:background .15s;}
  .add-form button:hover{background:#1e3f2b;}
  footer{text-align:center;padding:2rem;font-size:.7rem;color:var(--text-hint);}
  </style>
</head>
<body>

<header>
  <h1>Summer 的厨房</h1>
  <span class="date" id="date-label"></span>
</header>

<div class="main">

  <!-- ═══ 菜单库 ═══ -->
  <div class="sh">想怎么做 · 可选</div>
  <div class="card">
    <div class="fl">菜系</div>
    <div class="tr" id="cuisine-row">
      <span class="tag cuisine" data-val="chinese">中式家常</span>
      <span class="tag cuisine" data-val="jpkr">日韩风</span>
      <span class="tag cuisine" data-val="western">西式</span>
      <span class="tag cuisine" data-val="hotpot">火锅/涮</span>
    </div>
    <div class="fl" style="margin-top:1rem">做法</div>
    <div class="tr" id="method-row">
      <span class="tag method" data-val="stirfry">炒</span>
      <span class="tag method" data-val="stew">炖/煮</span>
      <span class="tag method" data-val="steam">蒸</span>
      <span class="tag method" data-val="grill">烤</span>
      <span class="tag method" data-val="poach">涮</span>
    </div>
  </div>

  <div class="rh">
    <div class="rl">菜单库 <span class="rc" id="count-label"></span></div>
  </div>

  <div id="filterBar"></div>
  <div id="results-area"></div>

  <div class="dessert-section">
    <div class="sh">今天来点甜点？</div>
    <div class="dessert-grid">
      <div class="dessert-card">
        <div class="dessert-name">戚风蛋糕</div>
        <div class="dessert-sub">自制 · 松软清甜</div>
      </div>
      <div class="dessert-card">
        <div class="dessert-name">巴斯克蛋糕</div>
        <div class="dessert-sub">自制 · 浓郁焦香</div>
      </div>
    </div>
  </div>

  <div class="bento-section">
    <div class="sh bento-head" onclick="toggleBento()"><span id="bentoArr">▸</span> Emma 便当</div>
    <div class="bento-card" id="bentoCard" style="display:none;">
      <div class="bento-body show">
        <div class="bento-top-label" style="margin-bottom:.5rem;">主食可选</div>
        <div class="bento-grid">
          <div class="bento-item hl-s1"><div class="bento-item-val">三明治 salami + cheese</div></div>
          <div class="bento-item hl-s2"><div class="bento-item-val">三明治 鸡蛋沙拉 + salami</div></div>
          <div class="bento-item hl-s2"><div class="bento-item-val">鸡蛋牛油果三明治</div></div>
          <div class="bento-item hl-baozi"><div class="bento-item-val">包子 / 馒头</div></div>
          <div class="bento-item hl-chicken"><div class="bento-item-val">炸鸡块</div></div>
          <div class="bento-item hl-s1"><div class="bento-item-val">寿司</div></div>
          <div class="bento-item hl-chicken"><div class="bento-item-val">蛋糕</div></div>
          <div class="bento-item hl-baozi"><div class="bento-item-val">蒜蓉面包</div></div>
        </div>

        <div class="bento-top-label" style="margin:1.25rem 0 .5rem;">固定搭配</div>
        <div class="bento-grid">
          <div class="bento-item fixed"><div class="bento-item-label">保温壶</div><div class="bento-item-val">白粥</div></div>
          <div class="bento-item fixed"><div class="bento-item-label">蔬菜</div><div class="bento-item-val">黄瓜条 / 胡萝卜条</div></div>
          <div class="bento-item fixed" style="grid-column:1 / -1;"><div class="bento-item-label">加餐</div><div class="bento-item-val">Yakult + 饼干</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="edit-section">
    <button class="edit-toggle" onclick="toggleEdit()">
      <span id="edit-arrow">▸</span> 管理晚餐菜单库
    </button>
    <div class="edit-body" id="edit-body">
      <ul class="edit-list" id="edit-list"></ul>
      <div style="margin-top:1.25rem;font-size:.72rem;color:var(--text-hint);margin-bottom:.5rem;">添加新菜</div>
      <div class="add-form">
        <input type="text" id="new-name" placeholder="菜名" />
        <input type="number" id="new-time" placeholder="时间(分钟)" min="5" max="180" />
        <input type="text" class="full" id="new-sub" placeholder="简短描述（一句话）" />
        <select id="new-ingr">
          <option value="">主食材</option>
          <optgroup label="肉/海鲜">
            <option value="fish">鱼</option>
            <option value="shrimp">虾</option>
            <option value="beef">牛肉</option>
            <option value="pork">猪肉</option>
            <option value="lamb">羊肉</option>
            <option value="chicken">鸡肉</option>
            <option value="lurou">卤肉/腊肉</option>
            <option value="snail">螺肉</option>
          </optgroup>
          <optgroup label="蔬菜">
            <option value="pumpkin">南瓜</option>
            <option value="tomato">西红柿</option>
            <option value="pepper">灯笼椒</option>
            <option value="cauliflower">花菜</option>
            <option value="bokchoy">小白菜</option>
            <option value="cucumber">黄瓜</option>
            <option value="avocado">牛油果</option>
            <option value="scallion">葱</option>
            <option value="potato">土豆</option>
            <option value="onion">洋葱</option>
            <option value="egg">鸡蛋</option>
          </optgroup>
          <option value="noodle">主食/面点</option>
          <option value="takeout">外卖</option>
        </select>
        <select id="new-cuisine">
          <option value="">菜系</option>
          <option value="chinese">中式家常</option>
          <option value="jpkr">日韩风</option>
          <option value="western">西式</option>
          <option value="hotpot">火锅/涮</option>
        </select>
        <select id="new-method" class="full">
          <option value="">做法</option>
          <option value="stirfry">炒</option>
          <option value="stew">炖/煮</option>
          <option value="steam">蒸</option>
          <option value="grill">烤</option>
          <option value="poach">涮</option>
        </select>
        <button onclick="addMeal()">+ 添加到菜单库</button>
      </div>
    </div>
  </div>

</div>

<footer>Summer 的厨房 · 菜单库 · 2026<br><span style="font-size:.72rem;">今晚这块肉怎么做 → 「今天 · 饮食」#51–70</span></footer>

const MEAL_KEY="summer_meals_v4";
const MEAL_MIGRATION="meals_migrated_veg2026";
const MEAL_MIGRATION_CUISINE="meals_tagged_cuisine_v1";
const MEAL_REMOVAL="meals_removed_2026_05";
const REMOVED_DEFAULT_NAMES=["蒜蓉粉丝蒸虾","naan + 咖喱虾","拍黄瓜"];
function loadMeals(){
  try{
    const s=localStorage.getItem(MEAL_KEY);
    if(!s)return JSON.parse(JSON.stringify(DEFAULT_MEALS));
    let stored=JSON.parse(s);
    let dirty=false;
    if(!localStorage.getItem(MEAL_MIGRATION)){
      const names=new Set(stored.map(m=>m.name));
      DEFAULT_MEALS.forEach(d=>{if(!names.has(d.name))stored.push(JSON.parse(JSON.stringify(d)));});
      localStorage.setItem(MEAL_MIGRATION,"1");
      dirty=true;
    }
    if(!localStorage.getItem(MEAL_MIGRATION_CUISINE)){
      const byName={};
      DEFAULT_MEALS.forEach(d=>{byName[d.name]=d;});
      stored.forEach(m=>{
        const def=byName[m.name];
        if(def){
          if(!m.cuisine)m.cuisine=[...def.cuisine];
          if(!m.method)m.method=[...def.method];
        }
      });
      localStorage.setItem(MEAL_MIGRATION_CUISINE,"1");
      dirty=true;
    }
    if(!localStorage.getItem(MEAL_REMOVAL)){
      const rm=new Set(REMOVED_DEFAULT_NAMES);
      stored=stored.filter(m=>!rm.has(m.name));
      localStorage.setItem(MEAL_REMOVAL,"1");
      dirty=true;
    }
    if(!localStorage.getItem("meals_eggtofu_v1")){
      const names=new Set(stored.map(m=>m.name));
      ["红烧蛋豆腐","麻婆蛋豆腐","葱烧蛋豆腐","香煎蛋豆腐"].forEach(n=>{
        const def=DEFAULT_MEALS.find(d=>d.name===n);
        if(def&&!names.has(n))stored.push(JSON.parse(JSON.stringify(def)));
      });
      localStorage.setItem("meals_eggtofu_v1","1");
      dirty=true;
    }
    if(!localStorage.getItem("meals_2026_05b")){
      const rm=new Set(["汉堡"]);
      stored=stored.filter(m=>!rm.has(m.name));
      const names=new Set(stored.map(m=>m.name));
      ["牛油果寿司卷","豆干炒肉丝","青椒豆干"].forEach(n=>{
        const def=DEFAULT_MEALS.find(d=>d.name===n);
        if(def&&!names.has(n))stored.push(JSON.parse(JSON.stringify(def)));
      });
      localStorage.setItem("meals_2026_05b","1");
      dirty=true;
    }
    if(dirty)saveMeals(stored);
    return stored;
  }catch{return JSON.parse(JSON.stringify(DEFAULT_MEALS));}
}
function saveMeals(m){localStorage.setItem(MEAL_KEY,JSON.stringify(m));}
let meals=loadMeals();

// ==================== 状态 ====================
let state={cuisine:null,method:null};

const d=new Date();
const days=["日","一","二","三","四","五","六"];
document.getElementById("date-label").textContent=`${d.getMonth()+1}月${d.getDate()}日 · 周${days[d.getDay()]}`;

// ==================== 菜单交互 ====================
function bindFilterTags(rowSel,key){
  document.querySelectorAll(rowSel+" .tag").forEach(el=>{
    el.addEventListener("click",()=>{
      const val=el.dataset.val;
      document.querySelectorAll(rowSel+" .tag").forEach(t=>t.classList.remove("active"));
      state[key]=state[key]===val?null:val;
      if(state[key])el.classList.add("active");
      renderMeals();
    });
  });
}
bindFilterTags("#cuisine-row","cuisine");
bindFilterTags("#method-row","method");

const CUISINE_LABELS={chinese:"中式家常",jpkr:"日韩风",western:"西式",hotpot:"火锅/涮"};
const METHOD_LABELS={stirfry:"炒",stew:"炖/煮",steam:"蒸",grill:"烤",poach:"涮"};

function renderFilterBar(){
  const bar=document.getElementById("filterBar");
  const chips=[];
  if(state.cuisine)chips.push(`<button class="fb-chip cuisine" onclick="clearCuisine()" title="点击移除">${CUISINE_LABELS[state.cuisine]||state.cuisine} ×</button>`);
  if(state.method)chips.push(`<button class="fb-chip method" onclick="clearMethod()" title="点击移除">${METHOD_LABELS[state.method]||state.method} ×</button>`);
  if(!chips.length){bar.innerHTML="";return;}
  bar.innerHTML=`<span class="fb-label">筛选中</span>${chips.join("")}<button class="fb-clear" onclick="clearAllFilters()">全部清除</button>`;
}
function clearCuisine(){
  state.cuisine=null;
  document.querySelectorAll("#cuisine-row .tag").forEach(t=>t.classList.remove("active"));
  renderMeals();
}
function clearMethod(){
  state.method=null;
  document.querySelectorAll("#method-row .tag").forEach(t=>t.classList.remove("active"));
  renderMeals();
}
function clearAllFilters(){
  state.cuisine=null;state.method=null;
  document.querySelectorAll(".tag.cuisine,.tag.method").forEach(t=>t.classList.remove("active"));
  renderMeals();
}

const INGR_LABELS={fish:"鱼",shrimp:"虾",beef:"牛肉",pork:"猪肉",lamb:"羊肉",chicken:"鸡肉",lurou:"卤/腊肉",snail:"螺肉",noodle:"面点",pumpkin:"南瓜",tomato:"番茄",pepper:"灯笼椒",cauliflower:"花菜",bokchoy:"小白菜",cucumber:"黄瓜",avocado:"牛油果",scallion:"葱",potato:"土豆",onion:"洋葱",egg:"鸡蛋",eggtofu:"蛋豆腐",doufugan:"豆干"};

function renderMeals(){
  renderFilterBar();
  const area=document.getElementById("results-area");
  const countEl=document.getElementById("count-label");
  const filtered=meals.filter(m=>{
    if(state.cuisine&&(!m.cuisine||!m.cuisine.includes(state.cuisine)))return false;
    if(state.method&&(!m.method||!m.method.includes(state.method)))return false;
    return true;
  });
  countEl.textContent=filtered.length>0?`${filtered.length} 道`:"";
  if(filtered.length===0){
    area.innerHTML='<div class="empty">这个组合下没有菜<br>换个筛选，或在下面「管理晚餐菜单库」里加一道</div>';
    return;
  }
  const html=filtered.map(m=>{
    const cls=m.isTakeout?" takeout":"";
    const badges=[];
    if(m.time>0)badges.push(`<span class="b time">${m.time} 分钟</span>`);
    if(m.isTakeout)badges.push('<span class="b takeout-tag">外卖</span>');
    else (m.ingr||[]).filter(i=>i!=="takeout"&&i!=="other").slice(0,3).forEach(i=>badges.push(`<span class="b using">${INGR_LABELS[i]||i}</span>`));
    return `<div class="meal${cls}">
      <div class="mn">${m.name}</div>
      <div class="ms">${m.sub}</div>
      <div class="badges">${badges.join("")}</div>
    </div>`;
  }).join("");
  area.innerHTML=`<div class="grid">${html}</div>`;
}

// ==================== 便当 ====================
function toggleBento(){
  const c=document.getElementById("bentoCard");
  const open=c.style.display==="none";
  c.style.display=open?"block":"none";
  document.getElementById("bentoArr").textContent=open?"▾":"▸";
}

// ==================== 编辑菜单库 ====================
function toggleEdit(){
  const body=document.getElementById("edit-body");
  const open=body.classList.toggle("open");
  document.getElementById("edit-arrow").textContent=open?"▾":"▸";
  if(open)renderEditList();
}
function renderEditList(){
  document.getElementById("edit-list").innerHTML=meals.map((m,i)=>
    `<li class="edit-item"><span class="edit-item-name">${m.name}</span><span style="color:var(--text-hint);font-size:.72rem;flex:1;padding:0 12px;">${m.time>0?m.time+'分钟':'外卖'}</span><button class="del-btn" onclick="deleteMeal(${i})">✕</button></li>`
  ).join("");
}
function deleteMeal(idx){
  if(!confirm(`确认删除「${meals[idx].name}」？`))return;
  meals.splice(idx,1);saveMeals(meals);renderEditList();renderMeals();
}
function addMeal(){
  const name=document.getElementById("new-name").value.trim();
  const sub=document.getElementById("new-sub").value.trim();
  const time=parseInt(document.getElementById("new-time").value)||20;
  const ingr=document.getElementById("new-ingr").value;
  const cuisine=document.getElementById("new-cuisine").value;
  const method=document.getElementById("new-method").value;
  if(!name){alert("请填写菜名");return;}
  meals.push({
    name,
    sub:sub||"暂无描述",
    time,
    ingr:ingr?[ingr]:["other"],
    cuisine:cuisine?[cuisine]:[],
    method:method?[method]:[],
  });
  saveMeals(meals);
  ["new-name","new-sub","new-time"].forEach(id=>document.getElementById(id).value="");
  ["new-ingr","new-cuisine","new-method"].forEach(id=>document.getElementById(id).value="");
  renderEditList();renderMeals();
}

// ==================== 启动 ====================
renderMeals();
</script>
</body>
</html>
